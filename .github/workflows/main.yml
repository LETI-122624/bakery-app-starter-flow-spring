name: Notificar revisão de Pull Request

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Criar comentário automático
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            👋 Olá @${{ github.event.pull_request.requested_reviewers[0].login || 'colega' }}!
            Um novo Pull Request foi aberto por @${{ github.actor }}.
            Dá uma vista de olhos quando puderes 😄
